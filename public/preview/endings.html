const observer=new ResizeObserver(entries=>{for(const entry of entries){const frame=entry.target.querySelector('iframe'),ratio=entry.target.clientWidth/width;frame.style.transform='scale('+ratio+')';entry.target.style.height=(height()*ratio)+'px'}});
function frameFor(scene,expanded=false){const wrap=document.createElement('div');wrap.className='frame-wrap';wrap.style.width=expanded?width+'px':'100%';const frame=document.createElement('iframe');frame.title=scene.name+' '+(kind==='gameover'?'게임오버':'졸업')+' 엔딩 미리보기';frame.setAttribute('sandbox','allow-scripts');frame.width=width;frame.height=height();frame.srcdoc=sceneHTML(scene);wrap.append(frame);observer.observe(wrap);return wrap;}
function render(){observer.disconnect();grid.replaceChildren();for(const character of order){const scene=scenes.find(s=>s.character===character&&s.kind===kind);if(!scene)continue;const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='card-header';const title=document.createElement('h2');title.textContent=scene.name;const sub=document.createElement('small');sub.textContent=kind==='gameover'?'GAME OVER':'GRADUATION';head.append(title,sub);const button=document.createElement('button');button.type='button';button.className='enlarge';button.setAttribute('aria-label',scene.name+' 엔딩 크게 보기');button.innerHTML='크게 보기 <span aria-hidden="true">↗</span>';button.addEventListener('click',()=>{document.querySelector('#detail-title').textContent=scene.name+' · '+(kind==='gameover'?'게임오버':'졸업');document.querySelector('#detail-body').replaceChildren(frameFor(scene,true));dialog.showModal();});card.append(head,frameFor(scene),button);grid.append(card);}document.querySelector('#notice').textContent=kind==='gameover'?'실제 서비스의 엔딩 화면을 사용한 미리보기입니다. 버튼을 눌러도 학습 기록은 바뀌지 않습니다.':'실제 졸업 화면을 사용한 미리보기입니다. 학습 일수·점수 등 졸업 기록은 예시 데이터입니다.';}
document.querySelectorAll('[data-kind]').forEach(button=>button.addEventListener('click',()=>{kind=button.dataset.kind;document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render()}));document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{width=Number(button.dataset.width);document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render()}));document.querySelector('#close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>{const status=document.querySelector('#status');status.textContent='';document.body.append(status);document.querySelector('#detail-body .frame-wrap')&&observer.unobserve(document.querySelector('#detail-body .frame-wrap'));document.querySelector('#detail-body').replaceChildren()});window.addEventListener('message',event=>{if(![...document.querySelectorAll('iframe')].some(frame=>frame.contentWindow===event.source))return;if(event.data?.endingPreview==='close'){dialog.close();return}if(event.data?.endingPreview==='action'){const status=document.querySelector('#status');(dialog.open?dialog:document.body).append(status);status.textContent='화면 확인용 미리보기입니다. 학습 기록은 변경되지 않습니다.';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>status.textContent='',2800)}});render();
</script></body></html>
