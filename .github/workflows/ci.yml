name: CI

on:
  push:
    branches: [main, master, "ci/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      LLM_PROVIDER: stub
      LLM_STUB_DELAY_MS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      # 잠금 파일(lockfile v9, pnpm.overrides)에 맞춰 pnpm 10 고정
      - run: corepack pnpm@10.33.0 install --frozen-lockfile
      - run: corepack pnpm@10.33.0 typecheck
      - run: corepack pnpm@10.33.0 lint
      # 외부 AI 호출 없이 stub 모드로 실행
      - run: corepack pnpm@10.33.0 exec tsx --test --test-concurrency=1 'src/lib/llm/__tests__/*.test.ts' 'src/lib/server/__tests__/*.test.ts'
      - run: corepack pnpm@10.33.0 build
